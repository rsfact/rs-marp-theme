<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marp Converter</title>
  <link rel="icon" href="https://raw.githubusercontent.com/rsfact/assets/refs/heads/main/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>Marp Converter</h1>
    <div class="toolbar">
      <label>
        <select id="editorMode" aria-label="Markdown または CSS">
          <option value="md">Markdown</option>
          <option value="css">CSS</option>
        </select>
      </label>
      <div class="new-feature">🆕 新着画像（PNG / JPEG）をドロップに対応しました。</div>
      <span class="spacer"></span>
      <button id="pdfBtn" type="button">PDF出力</button>
    </div>
  </header>

  <main>
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="preview"></div>
  </main>

  <script type="module" src="./script.js"></script>
</body>
</html>
